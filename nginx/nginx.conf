worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ── Rate-limiting zone for auth endpoints ──────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # ── Rate-limiting zone for the USSD gateway callback ───────────────────────
    # Separate from auth: USSD sessions are short but satellite/FM-network retries
    # can burst, so this gets a much higher allowance than /api/auth/*.
    limit_req_zone $binary_remote_addr zone=ussd_limit:10m rate=20r/s;

    # ── Upstream ───────────────────────────────────────────────────────────────
    upstream flask {
        server flask:8000;
    }

    server {
        listen 80;
        server_name _;

        # TLS is terminated by cloudflared (free Cloudflare Tunnel): cloudflared
        # dials nginx over plain HTTP on the internal docker network, so port 80
        # here never sees public cleartext. HSTS is therefore kept in the
        # commented custom-certificate block below — browsers ignore it over
        # plain HTTP, and it belongs with the real TLS listener.

        # CUSTOM DOMAIN / custom certificate — IDLE — costs money when enabled.
        # Set CUSTOM_DOMAIN_ENABLED=true and uncomment to terminate your own
        # certificate (paid or self-signed) at nginx instead of leaving TLS to
        # cloudflared. Then make the ingress rule in cloudflared/config.yml
        # exempt that hostname (or stop using the tunnel for it).
        # listen 443 ssl;
        # server_name <SET_IN_ENV>;                 # your custom domain
        # ssl_certificate     /etc/nginx/certs/ict_ticketing.crt;
        # ssl_certificate_key /etc/nginx/certs/ict_ticketing.key;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 10M;

        # ── Security headers (applied to all responses) ───────────────────────
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;

        # ── API proxy ─────────────────────────────────────────────────────────
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://flask;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── SSE stream (no buffering so events flow immediately) ──────────────
        location /api/events/stream {
            proxy_pass http://flask;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            chunked_transfer_encoding on;
        }

        location /api/ {
            proxy_pass http://flask;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── USSD gateway callback ─────────────────────────────────────────────
        # Only the carrier gateway's fixed egress IPs may reach /ussd; anything
        # else should be rejected before it touches Flask. Rate-limit is
        # separate from /api/auth/* (see the ussd_limit zone) and burst-tolerant
        # because the gateway retries every step of a session.
        #
        # VERIFIED 2026-09-10: Africa's Talking publishes NO static list of USSD
        # callback egress IPs anywhere public — their docs only describe the
        # POST payload (sessionId, serviceCode, phoneNumber, text), their help
        # centre has no callback-IP whitelist article, and USSD callbacks carry
        # no webhook signature. The ranges used earlier (165.56.73.0/24,
        # 41.139.0.0/24) were PLACEHOLDERS from the brief and cannot be trusted.
        # Procedure: email support@africastalking.com for the authoritative
        # CIDRs, fill them into the allow lines below, then uncomment `deny all;`.
        # Shipping `deny all` with guessed ranges = silent total outage of the
        # live USSD channel (far worse than the fail-open default).
        location = /ussd {
            # allow 165.56.73.0/24;   # ← replace with AT support-confirmed CIDR
            # allow 41.139.0.0/24;    # ← replace with AT support-confirmed CIDR
            # deny  all;              # ← enable ONLY after the allow lines have
            #                           been confirmed by AT support.

            limit_req zone=ussd_limit burst=90 nodelay;

            proxy_pass http://flask;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Frontend routes ───────────────────────────────────────────────────
        root /usr/share/nginx/html;
        index login.html;

        location = /login {
            try_files /login.html =404;
        }

        location /user {
            try_files $uri $uri/ /user/index.html;
        }

        location /admin {
            try_files $uri $uri/ /admin/index.html;
        }

        # Static assets (CSS, JS, images)
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /login.html;
        }
    }
}
