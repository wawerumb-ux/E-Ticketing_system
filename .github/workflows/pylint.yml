name: pylint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pylint:
    name: Pylint (backend, errors/fatal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies and pylint
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "pylint>=3.2,<4"

      - name: Run pylint
        working-directory: backend
        # --errors-only: block only fatal/error findings (real bugs: undefined
        # names, bad calls, format-arg mismatches). Convention/refactor noise is
        # excluded on purpose — this repo's CI contract is behavior-first
        # (scripts/ci-quality-gate.py), not a style gate.
        run: |
          pylint --rcfile=../.pylintrc --errors-only app.py extensions.py models.py helpers.py schema.py routes ussd.py totp.py

  quality-gate:
    name: Quality gate (tests + syntax + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Backend unit tests (isolated sqlite)
        working-directory: backend
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Python syntax check (compileall)
        working-directory: backend
        run: python -m compileall -q app.py extensions.py models.py helpers.py schema.py routes ussd.py totp.py

      - name: Frontend validator (offline-first rules)
        run: node scripts/validate-frontend.js