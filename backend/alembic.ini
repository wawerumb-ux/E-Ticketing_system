# Alembic configuration for the ICT Ticketing System
#
# Usage (from the backend/ directory):
#   alembic revision --autogenerate -m "initial schema"
#   alembic upgrade head
#
# The sqlalchemy.url is overridden at runtime by migrations/env.py from the
# DATABASE_URL environment variable.  The value below is only used as a
# fallback when running offline.

[alembic]
script_location = migrations
prepend_sys_path = .

sqlalchemy.url = mysql+pymysql://root:@localhost:3306/ict_ticketing

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
