<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Battery layer — the power slab, mint status rail -->
  <rect x="150" y="250" width="300" height="90" rx="18" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- cell separators -->
  <g stroke="#a6a6a6" stroke-width="1.5">
    <path d="M225 262v66"/>
    <path d="M300 262v66"/>
    <path d="M375 262v66"/>
  </g>
  <!-- terminal nub -->
  <rect x="438" y="282" width="18" height="26" rx="8" fill="#f5f5f5" stroke="#000000" stroke-width="2"/>
  <!-- low-charge cells -->
  <rect x="168" y="268" width="44" height="10" rx="5" fill="#d9defc"/>
  <rect x="243" y="268" width="44" height="10" rx="5" fill="#d9defc"/>
  <rect x="318" y="268" width="44" height="10" rx="5" fill="#d9defc"/>
  <!-- mint charge rail -->
  <rect x="168" y="296" width="150" height="12" rx="6" fill="#01fe93"/>
  <rect x="243" y="296" width="88" height="12" rx="6" fill="#01fe93" opacity="0.5"/>
  <!-- capacity tick marks -->
  <g fill="#a6a6a6">
    <circle cx="192" cy="322" r="3"/>
    <circle cx="300" cy="322" r="3"/>
    <circle cx="408" cy="322" r="3"/>
  </g>
</svg>